name: Gitleaks

# Detect secrets in pull request diffs using gitleaks-action, falling back
# to the open-source gitleaks CLI when no licence is available (Issue #868).
#
# Mirrors the canonical NEAT-AI pattern at
# stSoftwareAU/NEAT-AI/.github/workflows/quality.yml. Third-party
# actions are pinned to 40-character commit SHAs (Issue #1756) so a
# hijacked tag cannot exfiltrate CI secrets.

on:
  pull_request:
    # `*` does not match `/`, so `milestone/**` is needed for milestone
    # integration PRs to run this gate (Issue #788).
    branches: ["*", "milestone/**"]

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Issue #868: no Dependabot skip (Issue #219 added one). The licence-less
    # CLI fallback below scans Dependabot PRs instead of waving them through.
    #
    # The licence is bound at job level because the `secrets` context is
    # unavailable in step `if:` conditions, but `env` is. It is empty on
    # Dependabot and fork PRs, which receive no Actions secrets.
    env:
      # Org-level Gitleaks Pro licence (Issue #1636).
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Fetch the PR base branch so gitleaks-action's computed commit
      # range (`<base_sha>^..<head_sha>`) resolves on the runner.
      # Without this step the action fails with
      # "fatal: Invalid revision range" because the base ref's parent
      # is not in the shallow checkout (Issue #1756). Mirrors the
      # NEAT-AI quality.yml pattern.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true
      # Licensed path: runs only when the licence is present; unguarded it
      # exits with ErrLicense before scanning and leaves the job green.
      # gitleaks/gitleaks-action@v3.0.0
      - name: Gitleaks (licensed action)
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Licence-less fallback (Issue #868): the open-source CLI needs no
      # licence. The conditions are complementary, so exactly one scanner
      # runs and a green job always means a scanned diff.
      - name: Gitleaks (open-source CLI fallback)
        if: env.GITLEAKS_LICENSE == ''
        env:
          # The commit range reaches the shell via env:, never a ${{ }} splice.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Pinned release and the SHA-256 published in that release's
          # gitleaks_<version>_checksums.txt.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
