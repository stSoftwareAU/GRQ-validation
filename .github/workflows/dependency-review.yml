name: Dependency Review

on:
  pull_request:
    # `*` does not match `/`, so `milestone/**` is needed for milestone
    # integration PRs to run this gate (Issue #788).
    branches: ["*", "milestone/**"]

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Issue #885: diff the PR against its base and report whether it touches
  # dependency manifests. Non-PR runs have no diff base, so they always run in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the base...head diff has both commits locally.
          fetch-depth: 0
          # Read-only diff: don't persist the GITHUB_TOKEN into .git/config.
          persist-credentials: false
      - name: Detect changes to dependency manifests
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PATHS_REGEX: '^(Cargo\.toml|Cargo\.lock|deno\.jsonc?|deno\.lock|package(-lock)?\.json|\.github/workflows/.*)$'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff aborts the step (set -e) rather than skipping the gate.
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -qE "$PATHS_REGEX"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dependency manifests changed; skipping the gated job."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This job only reviews dependency changes — it never pushes back to
          # the repo or fetches a private submodule, so the GITHUB_TOKEN must
          # not be persisted into .git/config where a later compromised step
          # could read it (Issue #735).
          persist-credentials: false
      # actions/dependency-review-action@v4.9.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  # Issue #885: always runs, so this check reports a conclusion even when
  # `dependency-review` is skipped. Fails unless every needed job succeeded or was skipped.
  dependency-review-result:
    needs: [changes, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every gated job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then
            echo "::error::no job results reported"
            exit 1
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a gated job finished as '$result'"
                exit 1
                ;;
            esac
          done
