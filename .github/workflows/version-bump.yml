name: Version Bump

# Auto-increment the dashboard app version on every pull request so the
# service-worker cache key changes and clients pick up the new build
# (Issue #323). This replaces the unreliable local pre-commit hook.
#
# The same job also increments the Rust [package].version in Cargo.toml
# (Issue #818): the deployed scorer decides whether to rebuild by comparing its
# binary's --version against that field, so every merged change must carry a
# new one. Both bumps ride a single commit — two workflows pushing to the same
# PR head ref would race.
on:
  pull_request:
    branches: [ main ]

# Cancel superseded runs so rapid pushes to the same PR ref do not race on the
# version-bump commit (mirrors the other workflows in this repo).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump-version:
    name: Increment app version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks cannot push back to the PR branch, so only run for same-repo PRs.
    # Skip our own bot commit to avoid a self-trigger loop.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Check out the PR branch head (not the merge ref) so we can commit
          # the bump back to it. Full history is needed to read the base.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # denoland/setup-deno@v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Increment app version if not already bumped
        # Pass untrusted `github` context through env to avoid shell injection
        # in the run script (semgrep run-shell-injection).
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Read the app version on the base branch. If the file is missing
          # there, BASE_VERSION stays empty and the script always bumps.
          BASE_VERSION="$(git show "origin/${BASE_REF}:docs/sw.js" 2>/dev/null \
            | sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' || true)"
          echo "Base (${BASE_REF}) app version: ${BASE_VERSION:-<none>}"
          deno run --allow-read --allow-write scripts/bump_version.ts \
            --base-version "${BASE_VERSION}"

      # Cargo is needed to refresh Cargo.lock after the manifest bump; pin the
      # toolchain rather than depending on whatever the runner image ships.
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      # Bump the Rust package version so a deployed binary built from an
      # earlier commit is detectable as stale by scripts/needs_rebuild.sh
      # (Issue #818). The helper is idempotent against the base branch, so a
      # re-run — or a branch that bumped by hand — makes no further change.
      - name: Increment Cargo package version if not already bumped
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "${BASE_REF}"
          if ./scripts/version-increment.sh --already-bumped \
              --manifest ./Cargo.toml \
              --base-ref "origin/${BASE_REF}"; then
            echo "Cargo package version already bumped on this branch; no change."
            exit 0
          fi
          ./scripts/version-increment.sh --run \
            --manifest ./Cargo.toml \
            --base-ref "origin/${BASE_REF}"
          # CI builds with --locked, so the lock file's record of this package
          # must move with the manifest. --workspace updates workspace members
          # only, leaving every external crate pinned where the lock has it.
          cargo update --workspace

      - name: Commit and push the bump
        # Pass untrusted `github` context through env to avoid shell injection
        # in the run script (semgrep run-shell-injection).
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Versions already bumped on this branch; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sw.js docs/sw-register.js docs/trend.html
          git add Cargo.toml Cargo.lock
          git commit -m "Auto-increment app and package versions (Issues #323, #818)"
          git push origin "HEAD:${HEAD_REF}"
