name: Actionlint

# Lint gate for the workflow YAML itself (Issue #725).
#
# actionlint is the standard linter for GitHub Actions workflows: it catches
# syntax errors, invalid `${{ }}` expressions, unknown runner labels, and —
# through its bundled shellcheck integration — shell issues inside `run:`
# blocks. Running it on every pull request fails the build when a workflow
# regression is introduced, mirroring the shellcheck, markdown-lint, gitleaks
# and semgrep gates already in this repo.
#
# The organisation's Actions allow-list refuses third-party `docker://` step
# actions, so this job can no longer run actionlint as a container action
# (Issue #903). Instead it downloads the pinned actionlint release binary and
# verifies it against its published sha256 before running it — the release
# tarball is pinned to an exact version rather than a mutable tag, matching
# the digest pinning used elsewhere in this repo (supply-chain hardening,
# Issue #72). Dependabot's github-actions manager cannot track a plain `run:`
# download, so the version and checksum below must be bumped by hand together
# (Issue #903 supersedes the Issue #871 image-tag pin).

on:
  pull_request:
    # `*` does not match `/`, so `milestone/**` is needed for milestone
    # integration PRs to run this gate (Issue #788).
    branches: ["*", "milestone/**"]
  # Issue #866: this lint/checker gates the PR, so it no longer runs on push to
  # the default branch — that re-ran the same check the PR already passed and
  # wasted CI minutes. Manual dispatch stays available for ad-hoc runs.
  workflow_dispatch:

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Issue #885: diff the PR against its base and report whether it touches
  # workflow files. Non-PR runs have no diff base, so they always run in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the base...head diff has both commits locally.
          fetch-depth: 0
          # Read-only diff: don't persist the GITHUB_TOKEN into .git/config.
          persist-credentials: false
      - name: Detect changes to workflow files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PATHS_REGEX: '^\.github/workflows/'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff aborts the step (set -e) rather than skipping the gate.
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -qE "$PATHS_REGEX"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No workflow files changed; skipping the gated job."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Issue #867: this job only reads the tree to lint it; it never
          # pushes back or fetches a private submodule, so don't persist the
          # GITHUB_TOKEN into .git/config where a later step could read it.
          persist-credentials: false
      # Issue #903: the org Actions allow-list refuses the third-party
      # `docker://rhysd/actionlint` step action, so the pinned release binary
      # is downloaded and checksum-verified here instead of run as a
      # container action. The sha256 below comes from the release's
      # `actionlint_<ver>_checksums.txt`; refresh version and checksum
      # together when bumping.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.9"
          ACTIONLINT_SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      # The runner image ships shellcheck, so actionlint's bundled shellcheck
      # integration still lints `run:` blocks. `-color` keeps annotations
      # readable.
      - name: Run actionlint
        run: "\"$RUNNER_TEMP/actionlint\" -color"

  # Issue #885: always runs, so this check reports a conclusion even when
  # `actionlint` is skipped. Fails unless every needed job succeeded or was skipped.
  actionlint-result:
    needs: [changes, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every gated job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then
            echo "::error::no job results reported"
            exit 1
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a gated job finished as '$result'"
                exit 1
                ;;
            esac
          done
