name: Markdown Lint

on:
  pull_request:
    # `*` does not match `/`, so `milestone/**` is needed for milestone
    # integration PRs to run this gate (Issue #788).
    branches: ["*", "milestone/**"]
  # Issue #726: this lint/checker gates the PR, so it no longer runs on push to
  # the default branch — that re-ran the same check the PR already passed and
  # wasted CI minutes. Manual dispatch stays available for ad-hoc runs.
  workflow_dispatch:

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Issue #885: diff the PR against its base and report whether it touches
  # Markdown files. Non-PR runs have no diff base, so they always run in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the base...head diff has both commits locally.
          fetch-depth: 0
          # Read-only diff: don't persist the GITHUB_TOKEN into .git/config.
          persist-credentials: false
      - name: Detect changes to Markdown files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PATHS_REGEX: '(\.md$|^\.markdownlint-cli2\.jsonc$|^\.github/workflows/markdown-lint\.yml$)'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff aborts the step (set -e) rather than skipping the gate.
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -qE "$PATHS_REGEX"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Markdown files changed; skipping the gated job."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  markdownlint:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Issue #736: this job only lints markdown — it never pushes back nor
          # fetches a private submodule, so it does not need the GITHUB_TOKEN
          # written to .git/config, where a later compromised step could read
          # it. Do not persist the credential to disk.
          persist-credentials: false
      # actions/setup-node@v7.0.0 — runs on the node24 Actions runtime (Issue
      # #789): the SHA already pins v7.0.0, but the annotation wrongly read v4,
      # whose node20 runtime GitHub removes on 2026-09-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      # Install markdownlint-cli2 with a pinned exact version and install
      # scripts disabled (Issue #533, supply-chain hardening per Issue #2184).
      # Without --ignore-scripts the npm lifecycle hooks of markdownlint-cli2
      # and its entire transitive tree run in CI against the checked-out
      # workspace, and an unpinned spec floats to whatever the registry serves
      # each run — the install-time code-execution pivot of the Shai-Hulud and
      # Axios npm incidents. markdownlint-cli2 is pure JS with no build step, so
      # --ignore-scripts is safe and changes nothing functionally.
      - name: Install markdownlint-cli2
        run: npm install -g --ignore-scripts markdownlint-cli2@0.22.1
      - name: Run markdownlint-cli2
        run: markdownlint-cli2

  # Issue #885: always runs, so this check reports a conclusion even when
  # `markdownlint` is skipped. Fails unless every needed job succeeded or was skipped.
  markdownlint-result:
    needs: [changes, markdownlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every gated job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then
            echo "::error::no job results reported"
            exit 1
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a gated job finished as '$result'"
                exit 1
                ;;
            esac
          done
