name: Cargo Audit

on:
  pull_request:
    # `*` does not match `/`, so `milestone/**` is needed for milestone
    # integration PRs to run this gate (Issue #788).
    branches: ["*", "milestone/**"]
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Issue #885: diff the PR against its base and report whether it touches
  # Rust dependencies. Non-PR runs have no diff base, so they always run in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the base...head diff has both commits locally.
          fetch-depth: 0
          # Read-only diff: don't persist the GITHUB_TOKEN into .git/config.
          persist-credentials: false
      - name: Detect changes to Rust dependencies
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PATHS_REGEX: '^(Cargo\.toml|Cargo\.lock|\.github/workflows/cargo-audit\.yml)$'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff aborts the step (set -e) rather than skipping the gate.
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -qE "$PATHS_REGEX"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Rust dependencies changed; skipping the gated job."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disable cargo's HTTP/2 multiplexing. Crate downloads on GitHub runners
    # intermittently die with "Error in the HTTP2 framing layer" (curl 8.x),
    # which fails `cargo install cargo-audit` before the audit even runs.
    # Falling back to HTTP/1.1 sidesteps the flaky framing layer.
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Issue #729: audit only reads the tree to run cargo-audit; it never
          # pushes back or fetches a private submodule, so don't persist the
          # GITHUB_TOKEN into .git/config where a later step could read it.
          persist-credentials: false
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install cargo-audit
        # Pin to an explicit version with --locked so CI does not compile and
        # run an arbitrary newest cargo-audit dependency tree (Issue #124).
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Run cargo audit
        run: cargo audit

  # Issue #885: always runs, so this check reports a conclusion even when
  # `audit` is skipped. Fails unless every needed job succeeded or was skipped.
  cargo-audit-result:
    needs: [changes, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every gated job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then
            echo "::error::no job results reported"
            exit 1
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a gated job finished as '$result'"
                exit 1
                ;;
            esac
          done
