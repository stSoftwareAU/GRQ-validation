name: ShellCheck

# The `*` glob matches a single path segment and NOT `/`, so `["*"]` alone
# skips PRs whose base is a `milestone/<slug>` branch. `milestone/**` is listed
# explicitly so milestone integration PRs and pushes are scanned too — this is
# the shell-syntax gate that ci.yml's removed `bash -n` step used to provide on
# those branches (Issue #791; broader nine-workflow fix tracked in Issue #788).
on:
  pull_request:
    branches: ["*", "milestone/**"]
  push:
    branches: [main, master, "milestone/**"]

# Cancel superseded runs (Issue #139): rapid pushes to the same ref otherwise
# queue redundant scans that each hold a runner. Keying on workflow + ref with
# cancel-in-progress leaves only the latest run for a given ref alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This job only runs ShellCheck — it never pushes back to the repo or
          # fetches a private submodule, so the GITHUB_TOKEN must not be
          # persisted into .git/config where a later compromised step could read
          # it (Issue #738).
          persist-credentials: false
      # ludeeus/action-shellcheck pinned to commit SHA (Issue #27)
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: .
          severity: warning
